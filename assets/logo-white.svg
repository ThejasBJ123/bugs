<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldTealLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="60%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    
    <linearGradient id="goldGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e1a4" />
      <stop offset="50%" stop-color="#dfbb6c" />
      <stop offset="100%" stop-color="#c59d5f" />
    </linearGradient>
  </defs>

  <!-- Stylized Modern 'R' Monogram -->
  <g transform="translate(10, 10)">
    <path d="M 28 80 L 12 80 C 12 70, 20 62, 32 62 L 68 62 C 84 62, 95 50, 95 35 C 95 18, 82 8, 62 8 L 22 8 L 38 24 L 62 24 C 72 24, 78 28, 78 35 C 78 42, 70 46, 60 46 L 35 46 C 18 46, 8 58, 8 75 C 8 88, 18 96, 32 96 L 68 96 L 52 80 Z" fill="url(#emeraldTealLight)" />
    
    <path d="M 12 74 C 12 60, 25 54, 45 54 L 75 54 C 88 54, 98 64, 108 84 L 118 94 C 114 96, 102 96, 94 88 L 74 58 C 66 58, 54 58, 42 58 C 28 58, 22 65, 22 74 C 22 82, 28 88, 38 88 L 62 88 L 66 96 L 35 96 C 20 96, 12 86, 12 74 Z" fill="url(#goldGradientLight)" />
  </g>

  <!-- Woven Geometric Texture Icon -->
  <g transform="translate(150, 24)" fill="url(#goldGradientLight)">
    <rect x="0" y="30" width="18" height="6" rx="3" transform="rotate(-45 0 30)" />
    <rect x="18" y="12" width="18" height="6" rx="3" transform="rotate(45 18 12)" />
    <rect x="18" y="48" width="18" height="6" rx="3" transform="rotate(-45 18 48)" />
    <rect x="36" y="30" width="18" height="6" rx="3" transform="rotate(45 36 30)" />
    <rect x="36" y="66" width="18" height="6" rx="3" transform="rotate(-45 36 66)" />
    <rect x="54" y="48" width="18" height="6" rx="3" transform="rotate(45 54 48)" />
    <rect x="54" y="12" width="18" height="6" rx="3" transform="rotate(-45 54 12)" />
    <rect x="72" y="30" width="18" height="6" rx="3" transform="rotate(45 72 30)" />
    <rect x="0" y="66" width="18" height="6" rx="3" transform="rotate(45 0 66)" />
    <rect x="72" y="66" width="18" height="6" rx="3" transform="rotate(-45 72 66)" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(245, 10)">
    <text x="0" y="52" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="800" font-size="42" fill="#FFFFFF" letter-spacing="-0.5">
      eaving
    </text>
    
    <text x="1" y="16" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#dfbb6c" letter-spacing="3.5">
