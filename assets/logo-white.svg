    </text>

    <line x1="0" y1="72" x2="48" y2="72" stroke="url(#goldGradientLight)" stroke-width="2" stroke-linecap="round" />
    <text x="56" y="77" font-family="'Playfair Display', Georgia, serif" font-weight="600" font-size="16" fill="#e6ca7d" letter-spacing="1.5">
      Pvt Ltd
    </text>
    <line x1="120" y1="72" x2="260" y2="72" stroke="url(#goldGradientLight)" stroke-width="2" stroke-linecap="round" />

    <text x="2" y="96" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="500" font-size="10" fill="#cbd5e1" letter-spacing="1.2">
