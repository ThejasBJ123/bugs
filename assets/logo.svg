<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#043933" />
      <stop offset="40%" stop-color="#075e54" />
      <stop offset="100%" stop-color="#149d88" />
    </linearGradient>
    
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bf9543" />
      <stop offset="50%" stop-color="#e6ca7d" />
      <stop offset="100%" stop-color="#aa7c28" />
    </linearGradient>

    <linearGradient id="ribbonGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a7024" />
      <stop offset="50%" stop-color="#dfbb6c" />
      <stop offset="100%" stop-color="#f5e1a4" />
    </linearGradient>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Stylized Modern 'R' Monogram -->
  <g transform="translate(10, 10)" filter="url(#subtleGlow)">
    <!-- Top and diagonal loop of R in Emerald -->
    <path d="M 28 80 L 12 80 C 12 70, 20 62, 32 62 L 68 62 C 84 62, 95 50, 95 35 C 95 18, 82 8, 62 8 L 22 8 L 38 24 L 62 24 C 72 24, 78 28, 78 35 C 78 42, 70 46, 60 46 L 35 46 C 18 46, 8 58, 8 75 C 8 88, 18 96, 32 96 L 68 96 L 52 80 Z" fill="url(#emeraldTeal)" />
    
    <!-- Dynamic Gold Ribbon Weave intertwining the R -->
    <path d="M 12 74 C 12 60, 25 54, 45 54 L 75 54 C 88 54, 98 64, 108 84 L 118 94 C 114 96, 102 96, 94 88 L 74 58 C 66 58, 54 58, 42 58 C 28 58, 22 65, 22 74 C 22 82, 28 88, 38 88 L 62 88 L 66 96 L 35 96 C 20 96, 12 86, 12 74 Z" fill="url(#ribbonGold)" opacity="0.95" />
  </g>

  <!-- Woven Geometric Texture Icon -->
  <g transform="translate(150, 24)" fill="url(#goldGradient)">
    <!-- Diagonal Zig-zag Weave pattern -->
    <rect x="0" y="30" width="18" height="6" rx="3" transform="rotate(-45 0 30)" />
    <rect x="18" y="12" width="18" height="6" rx="3" transform="rotate(45 18 12)" />
    <rect x="18" y="48" width="18" height="6" rx="3" transform="rotate(-45 18 48)" />
    <rect x="36" y="30" width="18" height="6" rx="3" transform="rotate(45 36 30)" />
    <rect x="36" y="66" width="18" height="6" rx="3" transform="rotate(-45 36 66)" />
    <rect x="54" y="48" width="18" height="6" rx="3" transform="rotate(45 54 48)" />
    <rect x="54" y="12" width="18" height="6" rx="3" transform="rotate(-45 54 12)" />
    <rect x="72" y="30" width="18" height="6" rx="3" transform="rotate(45 72 30)" />
    <rect x="0" y="66" width="18" height="6" rx="3" transform="rotate(45 0 66)" />
    <rect x="72" y="66" width="18" height="6" rx="3" transform="rotate(-45 72 66)" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(245, 10)">
    <!-- "Rayashree" or "eaving" -->
    <text x="0" y="52" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="800" font-size="42" fill="#043933" letter-spacing="-0.5">
      eaving
    </text>
    
    <!-- Top Brand Tag -->
    <text x="1" y="16" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#0a524a" letter-spacing="3.5">
      RAYASHREE
    </text>

    <!-- Subtitle with Gold Divider Lines -->
    <line x1="0" y1="72" x2="48" y2="72" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round" />
    <text x="56" y="77" font-family="'Playfair Display', Georgia, serif" font-weight="600" font-size="16" fill="#a4772b" letter-spacing="1.5">
      Pvt Ltd
    </text>
    <line x1="120" y1="72" x2="260" y2="72" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round" />

    <text x="2" y="96" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="500" font-size="10" fill="#64748b" letter-spacing="1.2">
      HDPE / PP WOVEN SACKS • FIBC • JUTE • LINEN
    </text>
  </g>
</svg>
